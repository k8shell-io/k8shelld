name: CI/CD Pipeline

on:
  push:
    branches:
      - "main"

  pull_request:

jobs:
  test-and-build:
    runs-on: k8shell-runner

    env:
      GO111MODULE: on

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git for private modules
        run: |
          git config --global url."https://${{ secrets.GH_PAT_TOKEN }}:x-oauth-basic@github.com/".insteadOf "https://github.com/"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run unit tests
        run: make test

      - name: Build binaries
        run: make build

      - name: Run binary smoke tests
        run: make test-binary

      - name: Determine image tag and version
        run: |
          COMMIT_ID=$(git rev-parse --short HEAD)
          echo "COMMIT_ID=$COMMIT_ID" >> $GITHUB_ENV

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # For PRs: pr-{number}-{short-sha}
            PR_NUMBER=${{ github.event.pull_request.number }}
            IMAGE_TAG="pr-${PR_NUMBER}-${COMMIT_ID}"
            VERSION="pr-${PR_NUMBER}-${COMMIT_ID}"
          else
            # For pushes: use git describe
            VERSION=$(git describe --tags --match 'v*' | sed 's/-g.*//')
            IMAGE_TAG="$VERSION"
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Vendor Go modules
        run: |
          go mod vendor
          mkdir -p docker/k8shelld/files
          cp -r vendor docker/k8shelld/files/

      - name: Copy sources to docker context
        run: |
          mkdir -p docker/k8shelld/files
          cp -r go.mod go.sum internal pkg cmd sftp scripts -t docker/k8shelld/files/
          echo -n "k8shell-test/k8shelld:$IMAGE_TAG" > docker/k8shelld/BUILD

      - name: Load REPO_NAME from docker/k8shelld/BUILD
        run: echo "REPO_NAME=$(cat docker/k8shelld/BUILD)" >> $GITHUB_ENV

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: docker/k8shelld
          tags: ${{ secrets.REGISTRY }}/${{ env.REPO_NAME }}
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT_ID=${{ env.COMMIT_ID }}
