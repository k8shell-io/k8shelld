name: CI/CD Pipeline
# See https://github.com/k8shell-io/internals/tree/main/docs/handbook/docs/development/release_and_testing for information on release and testing processes.

on:
  push:
    branches:
      - "main"

  pull_request:

jobs:
  test-and-build:
    runs-on: k8shell-runner
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    env:
      GO111MODULE: on

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git for private modules
        run: |
          git config --global url."https://${{ secrets.GH_PAT_TOKEN }}:x-oauth-basic@github.com/".insteadOf "https://github.com/"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          # Disable cache for self-hosted runner to avoid conflicts
          # Self-hosted runners naturally persist Go cache between runs
          cache: false

      # Validate code quality and correctness
      - name: Run unit tests
        run: make test

      # Compile k8shelld and kbox executables
      - name: Build binaries
        run: make build

      # Verify binaries execute successfully
      - name: Run binary smoke tests
        run: make test-binary

      # Calculate version and image tag based on PR or push context
      # PRs: pr-{number}-{short-sha} using actual PR head commit
      # Pushes: git describe output
      - name: Determine image tag and version
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # For PRs: use actual PR head SHA, not merge commit
            COMMIT_ID=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
            PR_NUMBER=${{ github.event.pull_request.number }}
            IMAGE_TAG="pr-${PR_NUMBER}-${COMMIT_ID}"
            VERSION="pr-${PR_NUMBER}-${COMMIT_ID}"
          else
            # For pushes: use current commit and git describe
            COMMIT_ID=$(git rev-parse --short HEAD)
            VERSION=$(git describe --tags --match 'v*' | sed 's/-g.*//')
            IMAGE_TAG="$VERSION"
          fi

          echo "COMMIT_ID=$COMMIT_ID" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # Vendor dependencies and copy source files to Docker build context
      - name: Prepare Docker build context
        run: make vendor prepare-docker
        env:
          VERSION: ${{ env.VERSION }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}

      # Generate BUILD file with image name for Docker build
      - name: Set image name in BUILD file
        run: echo -n "k8shell-test/k8shelld:${{ env.IMAGE_TAG }}" > docker/k8shelld/BUILD

      # Extract image name from BUILD file for tagging
      - name: Load REPO_NAME from docker/k8shelld/BUILD
        run: echo "REPO_NAME=$(cat docker/k8shelld/BUILD)" >> $GITHUB_ENV

      # Authenticate to Harbor registry
      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # Build container image and push to registry with version metadata
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: docker/k8shelld
          tags: ${{ secrets.REGISTRY }}/${{ env.REPO_NAME }}
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT_ID=${{ env.COMMIT_ID }}

      # Add build information to job summary for easy access
      - name: Add image info to job summary
        run: |
          echo "## 🐳 Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ secrets.REGISTRY }}/${{ env.REPO_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ env.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ env.COMMIT_ID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pull command:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ secrets.REGISTRY }}/${{ env.REPO_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
