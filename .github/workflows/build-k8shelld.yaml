name: Build k8shelld image

on:
  push:
    branches:
      - "v0.10"
      - "main"
    tags:
      - "v*"

jobs:
  build-k8shelld:
    runs-on: k8shell-runner

    env:
      GO111MODULE: on

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Get version and commit ID
        run: |
          VERSION=$(git describe --tags --match '*' | sed 's/-g.*//')
          COMMIT_ID=$(git rev-parse --short HEAD)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "COMMIT_ID=$COMMIT_ID" >> $GITHUB_ENV

      - name: Install protoc
        run: |
          PROTOC_VERSION=31.1
          PROTOC=protoc-$PROTOC_VERSION-linux-aarch_64.zip
          curl -OL https://github.com/protocolbuffers/protobuf/releases/download/v31.1/$PROTOC
          unzip -o $PROTOC -d /usr/local bin/protoc
          unzip -o $PROTOC -d /usr/local 'include/*'
          rm -f $PROTOC

      - name: Install protoc Go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Build GRPC protos
        run: |
          mkdir -p grpc
          cd grpc && \
          rm -fr generated-go && \
          protoc \
            --go_out=. \
            --go-grpc_out=. \
            --go_opt=Mk8shelld.proto=generated-go/k8shelldpb \
            --go-grpc_opt=Mk8shelld.proto=generated-go/k8shelldpb \
            k8shelld.proto

      - name: Copy sources to docker context
        run: |
          mkdir -p docker/k8shelld/files
          cp -r go.mod go.sum grpc internal cmd sftp scripts -t docker/k8shelld/files/
          echo -n "k8shell-base/k8shelld:$VERSION" > docker/k8shelld/BUILD

      - name: Load REPO_NAME from docker/k8shelld/BUILD
        run: echo "REPO_NAME=$(cat docker/k8shelld/BUILD)" >> $GITHUB_ENV

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: docker/k8shelld
          tags: ${{ secrets.REGISTRY }}/${{ env.REPO_NAME }}
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT_ID=${{ env.COMMIT_ID }}

