# system settings
# identity token and public key for JWT verification
identity:
  tokenPath: /run/secrets/identity-token
  publicKeyPath: /run/secrets/identity-public-key
  signingMethod: rs256

system:
  # true to enable profiling
  # if enabled, pprof will be available at localhost:6060
  pprof: false

  # api server
  apiServer: 
    enabled: false
    address: http://api-server.k8shell-test:9101

  # grpc server
  grpc:
    port: 3822
    enableTLS: false
    certFile: /etc/tls/k8shelld/tls.crt
    keyFile: /etc/tls/k8shelld/tls.key

    audience: k8shelld
    allowed:
      - namespace: "*"
        serviceAccount: "*"

# reap zombie processes
reapZombies:
  enabled: true

# terminate orphaned processes, i.e. processes that were reparented to init (pid 1)
terminateOrphans:
  enabled: true
  checkInterval: 5
  exclude:
  - .*JetBrains.*

# docker settings
docker:
  enabled: true
  createDockerSockSymlink: true
      
