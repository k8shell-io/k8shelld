# system settings
system:
  # true to enable profiling
  # if enabled, pprof will be available at localhost:6060
  pprof: false

  # api server
  apiServer: 
    enabled: false
    address: http://api-server.k8shell-test:9101

  # grpc server
  grpc:
    port: 3822
    enableTLS: false
    certFile: /etc/tls/k8shelld/tls.crt
    keyFile: /etc/tls/k8shelld/tls.key

    audience: k8shelld
    allowed:
      - namespace: "*"
        serviceAccount: "*"

# workspace user
user:
  username: bruckins
  fullname: "Bruck Ins"
  uid: 166548839 
  gid: 166548839
  shell: /bin/bash
  sudo: true

  # supplementary groups
  groups:
    - name: k8shell-docker
      gid: 999
      
# port forwarding rules
portForwarding:
  - localnetworks:0

# reap zombie processes
reapZombies:
  enabled: true

# terminate orphaned processes, i.e. processes that were reparented to init (pid 1)
terminateOrphans:
  enabled: true
  checkInterval: 5
  exclude:
  - .*JetBrains.*

# docker settings
docker:
  enabled: true
  createDockerSockSymlink: true
  storages:
    - name: graphdb
      path: /var/lib/docker
      readonly: false
      size: 5Gi
      
storages:
  - name: home
    path: /home/vitvatom
    readonly: false
    size: 10Gi
  - name: shared
    path: /opt/shared
    readonly: false
    size: 50Gi

enableApps: true

apps:
  vscode:
    listen: 8080
    binary: "/usr/bin/code-server"
    versionCmd: ["/usr/bin/code-server", "--version"]
    versionRegex: "^([0-9]+\\.[0-9]+\\.[0-9]+)"  
    install: |
      curl -fsSL https://code-server.dev/install.sh | sh
    start: ["/usr/bin/code-server", "--auth=none", "--bind-addr=127.0.0.1:8080", "."]
    restartPolicy: always
    
  jupyter:
    listen: 8888
    binary: "${HOME}/.local/bin/jupyter-lab"
    versionCmd: ["${HOME}/.local/bin/jupyter-lab", "--version"]
    versionRegex: "^([0-9]+\\.[0-9]+\\.[0-9]+)"
    install: |
      pip install jupyter
    start: ["${HOME}/.local/bin/jupyter-lab", "--ip=0.0.0.0", "--port=8888", "--no-browser"]
    restartPolicy: always
