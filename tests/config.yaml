# system settings
system:
  # true to enable profiling
  # if enabled, pprof will be available at localhost:6060
  pprof: false

  # api server
  apiServer: http://api-server.k8shell-test:9101

  # grpc server
  grpc:
    port: 2822
    enableTLS: true
    certFile: /etc/tls/k8shelld/tls.crt
    keyFile: /etc/tls/k8shelld/tls.key

    audience: k8shelld
    allowed:
      - namespace: "*"
        serviceAccount: "*"

# workspace user
user:
  username: bruckins
  fullname: "Bruck Ins"
  uid: 1001
  gid: 1001
  shell: /bin/bash
  sudo: true

  # supplementary groups
  groups:
    - name: k8shell-docker
      gid: 999
      
# port forwarding rules
portForwarding:
  - localnetworks:0

# reap zombie processes
reapZombies:
  enabled: true

# terminate orphaned processes, i.e. processes that were reparented to init (pid 1)
terminateOrphans:
  enabled: true
  checkInterval: 5
  exclude:
  - .*JetBrains.*

# docker settings
docker:
  createDockerSockSymlink: true

apps:
  vscode:
    listen: 8080
    version: "4.106.2"
    deps: ["curl", "sh"]
    binary: "/usr/bin/code-server"
    versionCmd: ["/usr/bin/code-server", "--version"]
    versionRegex: "^([0-9]+\\.[0-9]+\\.[0-9]+)"  
    install: |
      #!/usr/bin/env sh
      curl -fsSL https://code-server.dev/install.sh | sh
    start: ["/usr/bin/code-server", "--auth=none", "--bind-addr=127.0.0.1:8080"]
    
  jupyter:
    listen: 8888
    version: "1.0.0"
    deps: ["python3"]
    binary: "/opt/apps/jupyter/bin/jupyter-lab"
    versionCmd: ["/opt/apps/jupyter/bin/jupyter-lab", "--version"]
    versionRegex: "^([0-9]+\\.[0-9]+\\.[0-9]+)"
    install: |
      #!/usr/bin/env bash
      set -euo pipefail
      python3 -m venv /opt/apps/jupyter
      /opt/apps/jupyter/bin/pip install jupyterlab==1.0.0
    start: ["/opt/apps/jupyter/bin/jupyter-lab", "--ip=0.0.0.0", "--port=8888", "--no-browser"]
